name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace > ../gradle_build.log 2>&1 || true

      - name: Push Build Log to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b build-logs
          git add gradle_build.log
          git commit -m "Upload build log" || true
          git push -f origin build-logs || true

      - name: Verify and Prepare APK Output
        run: |
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "❌ APK build failed. Log content:"
            cat gradle_build.log
            exit 1
          fi
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/LearnX.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LearnX-APK
          path: output/LearnX.apk
          if-no-files-found: error
